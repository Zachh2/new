<!DOCTYPE html>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap');
        @keyframes slide-up { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes scale-in { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-slide-up { animation: slide-up 0.4s ease-out forwards; }
        .animate-scale-in { animation: scale-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .loading-shimmer { background: linear-gradient(90deg, rgba(22,27,34,0.4) 0%, rgba(99,102,241,0.2) 50%, rgba(22,27,34,0.4) 100%); background-size: 1000px 100%; animation: shimmer 1.5s infinite; }
        .stat-card { background: rgba(22, 27, 34, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(48, 54, 61, 0.8); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .stat-card:hover { border-color: #6366f1; transform: translateY(-4px); box-shadow: 0 12px 40px -12px rgba(99, 102, 241, 0.4); }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .mono { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f46e5; }
        .chip { transition: all .2s; }
        .chip-active { background: rgba(99,102,241,.2); color: #fff; border-color: #6366f1; }
        pre[class*="language-"] { background: transparent !important; margin: 0 !important; font-size: 11px !important; }
        .health-bar { height: 6px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.06); }
        .health-bar > i { display: block; height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.4,0,.2,1); }
    </style>
    <link rel="stylesheet" href="/theme.css">
    <script defer src="/palette.js"></script>
    <script defer src="/telemetry.js"></script>
    <link rel="manifest" href="/manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZACH_CORE">
    <link rel="apple-touch-icon" href="/icon.svg">
    <script defer src="/mobile.js"></script>
</head>
<body class="bg-[#0b0e14] text-gray-300 min-h-screen">

<canvas id="particle-canvas"></canvas>

<!-- ===== modal ===== -->
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div id="modal-box" class="stat-card rounded-[2rem] w-full max-w-3xl max-h-[88vh] overflow-hidden animate-scale-in relative">
        <button onclick="Modal.hide()" class="absolute top-6 right-6 p-2 rounded-xl hover:bg-white/5 text-gray-500 hover:text-white transition-all z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <div id="modal-body" class="overflow-y-auto max-h-[88vh] p-8"></div>
    </div>
</div>

<div class="max-w-6xl mx-auto p-4 md:p-10 relative z-10">

    <!-- ===== header ===== -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-6">
        <div class="space-y-1">
            <div class="flex items-center gap-3">
                <div id="status-indicator" class="w-3.5 h-3.5 rounded-full bg-zinc-600"></div>
                <h1 class="text-3xl font-black text-white tracking-tighter italic uppercase">Command Center</h1>
            </div>
            <p id="scan-info" class="text-[9px] mono text-gray-500 tracking-[0.3em] uppercase">Scanning command modules...</p>
        </div>
        <div class="flex items-center gap-2 w-full md:w-auto">
            <button onclick="scanCommands(true)" class="flex-1 md:flex-none bg-zinc-900/90 hover:bg-zinc-800 text-zinc-400 border border-zinc-800 px-5 py-3 rounded-2xl font-black text-[10px] tracking-widest transition-all active:scale-95 uppercase">Rescan</button>
            <a href="/" class="flex-1 md:flex-none text-center bg-indigo-600 hover:bg-indigo-500 text-white px-7 py-3 rounded-2xl font-black text-[10px] tracking-widest transition-all shadow-lg active:scale-95 uppercase">Dashboard</a>

    </header>

    <!-- ===== stats ===== -->
    <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
        <div class="stat-card p-5 rounded-[2rem] border-l-4 border-l-indigo-500">
            <p class="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-2">Commands</p>
            <p id="s-total" class="text-3xl font-black text-white">--</p>
        </div>
        <div class="stat-card p-5 rounded-[2rem] border-l-4 border-l-emerald-500">
            <p class="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-2">Healthy</p>
            <p id="s-healthy" class="text-3xl font-black text-emerald-400">--</p>
        </div>
        <div class="stat-card p-5 rounded-[2rem] border-l-4 border-l-amber-500">
            <p class="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-2">Warnings</p>
            <p id="s-warn" class="text-3xl font-black text-amber-400">--</p>
        </div>
        <div class="stat-card p-5 rounded-[2rem] border-l-4 border-l-red-500">
            <p class="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-2">Critical</p>
            <p id="s-crit" class="text-3xl font-black text-red-400">--</p>
        </div>
        <div class="stat-card p-5 rounded-[2rem] border-l-4 border-l-sky-500">
            <p class="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-2">Categories</p>
            <p id="s-cats" class="text-3xl font-black text-sky-400">--</p>
        </div>
    </div>

    <!-- ===== health audit ===== -->
    <div class="stat-card p-6 rounded-[2rem] mb-6">
        <div class="flex items-center justify-between mb-5">
            <h3 class="text-white font-black text-xs uppercase tracking-widest">Health Audit</h3>
            <span id="health-score" class="text-[9px] mono text-gray-500"></span>
        </div>
        <div id="audit-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </div>

    <!-- ===== filters ===== -->
    <div class="stat-card p-5 rounded-[2rem] mb-6">
        <input id="search" type="text" placeholder="Search name, description, category, credits..."
               class="w-full bg-black/40 border border-white/10 rounded-2xl px-5 py-4 text-white mono text-xs focus:border-indigo-500 outline-none transition-all mb-4">
        <div id="cat-chips" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- ===== grid ===== -->
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <div id="empty" class="hidden text-center py-16 text-gray-600 text-xs mono uppercase tracking-widest">No commands match that filter</div>
</div>

<script>
/* ============================================================
   Command Center — reads the bot's own command files through the
   existing /api/files endpoints. No new backend routes required.
   ============================================================ */

let COMMANDS_DIR = 'commands';   // resolved at scan time
const DIR_CANDIDATES = ['commands', 'modules/commands', 'script/commands', 'scripts/cmds', 'includes/commands'];

async function listDir(path) {
    const r = await fetch('/api/files/list?path=' + encodeURIComponent(path));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!Array.isArray(d)) throw new Error('unexpected response');
    return d;
}

// Try the known layouts, then fall back to scanning the root for any folder
// whose name looks like a command directory.
async function findCommandsDir() {
    for (const c of DIR_CANDIDATES) {
        try {
            const f = await listDir(c);
            if (f.some(x => !x.isDirectory && /\.js$/i.test(x.name))) return c;
        } catch (e) {}
    }
    try {
        const root = await listDir('');
        const dirs = root.filter(x => x.isDirectory && /cmd|command/i.test(x.name));
        for (const d of dirs) {
            try {
                const f = await listDir(d.name);
                if (f.some(x => !x.isDirectory && /\.js$/i.test(x.name))) return d.name;
            } catch (e) {}
        }
    } catch (e) {}
    return null;
}
let ALL = [];          // parsed command objects
let CAT = 'all';       // active category filter
let QUERY = '';

/* ---------- tiny modal ---------- */
const Modal = {
    show(html) {
        document.getElementById('modal-body').innerHTML = html;
        const m = document.getElementById('modal');
        m.classList.remove('hidden'); m.classList.add('flex');
    },
    hide() {
        const m = document.getElementById('modal');
        m.classList.add('hidden'); m.classList.remove('flex');
    }
};
document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') Modal.hide();
});

const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* ---------- config parser (no eval — safe against whatever is in the file) ---------- */
function parseConfig(src) {
    const out = { deps: [] };
    const block = src.match(/module\.exports\.config\s*=\s*\{([\s\S]*?)\n\s*\};/);
    const body = block ? block[1] : src.slice(0, 1200);

    const str = k => { const m = body.match(new RegExp(k + '\\s*:\\s*["\'`]([^"\'`]*)["\'`]')); return m ? m[1] : null; };
    const num = k => { const m = body.match(new RegExp(k + '\\s*:\\s*(-?\\d+)')); return m ? +m[1] : null; };
    const bool = k => { const m = body.match(new RegExp(k + '\\s*:\\s*(true|false)')); return m ? m[1] === 'true' : null; };

    out.name        = str('name');
    out.version     = str('version');
    out.description = str('description');
    out.category    = str('commandCategory') || 'uncategorized';
    // the bot mixes "Admin"/"admin", "Media"/"media" — group them as one
    out.catKey      = out.category.toLowerCase().trim();
    out.catLabel    = out.catKey.charAt(0).toUpperCase() + out.catKey.slice(1);
    out.credits     = str('credits');
    out.usages      = str('usages') || str('usage');
    out.cooldowns   = num('cooldowns');
    out.permission  = num('hasPermssion');
    if (out.permission === null) out.permission = num('hasPermission');
    out.usePrefix   = bool('usePrefix');
    out.hide        = bool('hide');

    const dep = body.match(/dependencies\s*:\s*\{([\s\S]*?)\}/);
    if (dep) out.deps = (dep[1].match(/["'`]([^"'`]+)["'`]\s*:/g) || []).map(s => s.replace(/["'`:]/g,'').trim());
    return out;
}

/* ---------- static analysis: the same checks I run on the bot itself ---------- */
function analyse(src, cfg) {
    const has = re => re.test(src);
    const f = [];

    const usesNet   = has(/axios|node-fetch|\bfetch\s*\(|request\s*\(/);
    const hasTimeout= has(/timeout\s*:|defaults\.timeout|AbortController|\.abort\(/);
    const hasTry    = has(/try\s*\{/);
    const hasEdit   = has(/editMessage/);
    const hasReact  = has(/setMessageReaction/);
    const hasRun    = has(/module\.exports\.run/);
    const hasEvent  = has(/module\.exports\.handleEvent/);
    const hasReply  = has(/module\.exports\.handleReply/);

    if (cfg.usePrefix === null && hasRun)
        f.push({ sev: 'crit',  msg: 'Missing usePrefix — command may not register' });
    if (!cfg.name)
        f.push({ sev: 'crit',  msg: 'No config.name found' });
    if (usesNet && !hasTimeout)
        f.push({ sev: 'crit',  msg: 'Network call with no timeout — can hang the bot' });
    if (usesNet && !hasTry)
        f.push({ sev: 'crit',  msg: 'Network call with no try/catch — crashes on failure' });
    if (cfg.permission === null)
        f.push({ sev: 'warn',  msg: 'No hasPermssion set' });
    if (!hasEdit && hasRun)
        f.push({ sev: 'warn',  msg: 'No api.editMessage — replies cannot update in place' });
    if (!hasReact && hasRun)
        f.push({ sev: 'warn',  msg: 'No reactions — no ⏳/✅ feedback' });
    if (!cfg.description)
        f.push({ sev: 'warn',  msg: 'No description — shows blank in help' });

    return {
        findings: f,
        flags: { usesNet, hasTimeout, hasTry, hasEdit, hasReact, hasRun, hasEvent, hasReply },
        level: f.some(x => x.sev === 'crit') ? 'crit' : f.length ? 'warn' : 'ok'
    };
}

/* ---------- concurrency-limited fetch so we don't open 79 sockets ---------- */
async function pool(items, limit, worker, onTick) {
    const out = []; let i = 0, done = 0;
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
        while (i < items.length) {
            const idx = i++;
            try { out[idx] = await worker(items[idx]); } catch (e) { out[idx] = null; }
            if (onTick) onTick(++done, items.length);
        }
    }));
    return out.filter(Boolean);
}

/* ---------- scan ---------- */
async function scanCommands(force) {
    const info = document.getElementById('scan-info');
    const grid = document.getElementById('grid');
    document.getElementById('status-indicator').className = 'w-3.5 h-3.5 rounded-full bg-amber-500 animate-pulse-soft';
    info.innerText = 'Listing command directory...';
    grid.innerHTML = Array.from({length:6}, () =>
        '<div class="stat-card rounded-[2rem] h-40 loading-shimmer"></div>').join('');

    let files;
    try {
        const found = await findCommandsDir();
        if (!found) throw new Error('no command folder found (tried: ' + DIR_CANDIDATES.join(', ') + ')');
        COMMANDS_DIR = found;
        info.innerText = 'Reading ' + COMMANDS_DIR + '/ ...';
        files = await listDir(COMMANDS_DIR);
    } catch (e) {
        info.innerText = 'Could not read ' + COMMANDS_DIR + '/';
        document.getElementById('status-indicator').className = 'w-3.5 h-3.5 rounded-full bg-red-500';
        grid.innerHTML = `<div class="stat-card p-8 rounded-[2rem] col-span-full text-center">
            <p class="text-red-400 font-black text-xs uppercase tracking-widest mb-2">Scan failed</p>
            <p class="text-gray-500 text-[10px] mono">${esc(e.message)}</p>
            <p class="text-gray-600 text-[9px] mt-4">Check that /api/files/list can reach the "${esc(COMMANDS_DIR)}" folder.</p>
        </div>`;
        return;
    }

    const js = (files || []).filter(f => !f.isDirectory && /\.js$/i.test(f.name));
    ALL = await pool(js, 6, async (f) => {
        const p = COMMANDS_DIR + '/' + f.name;
        const r = await fetch('/api/files/read?path=' + encodeURIComponent(p));
        const d = await r.json();
        const src = d.content || '';
        const cfg = parseConfig(src);
        const an  = analyse(src, cfg);
        return { file: f.name, path: p, src, ...cfg, ...an };
    }, (done, total) => { info.innerText = `Parsing modules ${done}/${total}`; });

    // duplicate command names collide in the loader — flag both sides
    const byName = {};
    ALL.forEach(c => { if (c.name) (byName[c.name] = byName[c.name] || []).push(c.file); });
    Object.entries(byName).forEach(([n, fs]) => {
        if (fs.length > 1) ALL.forEach(c => {
            if (c.name === n) {
                c.findings.push({ sev: 'crit', msg: 'Duplicate name "' + n + '" — also in ' + fs.filter(x => x !== c.file).join(', ') });
                c.level = 'crit';
            }
        });
    });

    document.getElementById('status-indicator').className = 'w-3.5 h-3.5 rounded-full bg-emerald-500';
    info.innerText = `${ALL.length} modules indexed · ${new Date().toLocaleTimeString()}`;
    renderStats(); renderAudit(); renderChips(); render();
}

/* ---------- stats ---------- */
function renderStats() {
    const cats = new Set(ALL.map(c => c.catKey));
    document.getElementById('s-total').innerText   = ALL.length;
    document.getElementById('s-healthy').innerText = ALL.filter(c => c.level === 'ok').length;
    document.getElementById('s-warn').innerText    = ALL.filter(c => c.level === 'warn').length;
    document.getElementById('s-crit').innerText    = ALL.filter(c => c.level === 'crit').length;
    document.getElementById('s-cats').innerText    = cats.size;
}

/* ---------- audit ---------- */
function renderAudit() {
    const n = ALL.length || 1;
    const rows = [
        ['api.editMessage',  ALL.filter(c => c.flags.hasEdit).length,  'indigo'],
        ['Reactions',        ALL.filter(c => c.flags.hasReact).length, 'sky'],
        ['try/catch guard',  ALL.filter(c => c.flags.hasTry).length,   'emerald'],
        ['Network timeouts', ALL.filter(c => !c.flags.usesNet || c.flags.hasTimeout).length, 'amber'],
        ['usePrefix set',    ALL.filter(c => c.usePrefix !== null).length, 'fuchsia'],
        ['Has description',  ALL.filter(c => !!c.description).length,  'teal'],
    ];
    const colors = { indigo:'#6366f1', sky:'#0ea5e9', emerald:'#10b981', amber:'#f59e0b', fuchsia:'#d946ef', teal:'#14b8a6' };
    document.getElementById('audit-grid').innerHTML = rows.map(([label, val, c]) => {
        const pct = Math.round(val / n * 100);
        return `<div>
            <div class="flex justify-between items-baseline mb-1.5">
                <span class="text-[9px] font-black uppercase tracking-widest text-gray-400">${label}</span>
                <span class="text-[9px] mono text-gray-500">${val}/${ALL.length} · ${pct}%</span>
            </div>
            <div class="health-bar"><i style="width:${pct}%;background:${colors[c]}"></i></div>
        </div>`;
    }).join('');

    const score = Math.round(rows.reduce((a, [, v]) => a + v / n, 0) / rows.length * 100);
    document.getElementById('health-score').innerText = 'Overall ' + score + '%';
}

/* ---------- category chips ---------- */
function renderChips() {
    const counts = {}, labels = {};
    ALL.forEach(c => { counts[c.catKey] = (counts[c.catKey] || 0) + 1; labels[c.catKey] = c.catLabel; });
    const cats = ['all', ...Object.keys(counts).sort()];
    document.getElementById('cat-chips').innerHTML = cats.map(c => `
        <button onclick="setCat('${esc(c)}')" data-cat="${esc(c)}"
            class="chip ${c === CAT ? 'chip-active' : ''} border border-white/10 text-gray-400 px-4 py-2 rounded-xl text-[8px] font-black uppercase tracking-widest">
            ${esc(c === 'all' ? 'all' : labels[c])} <span class="opacity-50">${c === 'all' ? ALL.length : counts[c]}</span>
        </button>`).join('');
}
function setCat(c) { CAT = c; renderChips(); render(); }

/* ---------- grid ---------- */
const DOT = { ok: 'bg-emerald-500', warn: 'bg-amber-500', crit: 'bg-red-500' };
const RING = { ok: 'border-l-emerald-500', warn: 'border-l-amber-500', crit: 'border-l-red-500' };

function render() {
    const q = QUERY.toLowerCase();
    const list = ALL.filter(c =>
        (CAT === 'all' || c.catKey === CAT) &&
        (!q || [c.name, c.file, c.description, c.category, c.credits].some(v => (v || '').toLowerCase().includes(q)))
    ).sort((a, b) => (a.name || a.file).localeCompare(b.name || b.file));

    document.getElementById('empty').classList.toggle('hidden', list.length > 0);
    document.getElementById('grid').innerHTML = list.map((c, i) => `
        <div class="stat-card p-5 rounded-[2rem] border-l-4 ${RING[c.level]} animate-slide-up cursor-pointer"
             style="animation-delay:${Math.min(i,12)*0.03}s" onclick="openDetail('${esc(c.file)}')">
            <div class="flex justify-between items-start mb-3">
                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full ${DOT[c.level]}"></span>
                        <h4 class="text-white font-black text-xs truncate">${esc(c.name || c.file)}</h4>
                    </div>
                    <p class="text-[7px] text-gray-500 mono mt-1 truncate">${esc(c.file)}${c.version ? ' · v' + esc(c.version) : ''}</p>
                </div>
                <span class="bg-indigo-500/10 text-indigo-400 text-[7px] px-2 py-1 rounded-lg whitespace-nowrap">${esc(c.catLabel)}</span>
            </div>
            <p class="text-[9px] text-gray-500 leading-relaxed mb-3 line-clamp-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">
                ${esc(c.description || 'No description')}
            </p>
            <div class="flex flex-wrap gap-1">
                ${c.flags.hasEdit  ? '<span class="text-[6px] font-black uppercase bg-indigo-500/10 text-indigo-400 px-2 py-1 rounded">edit</span>' : ''}
                ${c.flags.hasReact ? '<span class="text-[6px] font-black uppercase bg-sky-500/10 text-sky-400 px-2 py-1 rounded">react</span>' : ''}
                ${c.flags.usesNet  ? '<span class="text-[6px] font-black uppercase bg-amber-500/10 text-amber-400 px-2 py-1 rounded">net</span>' : ''}
                ${c.flags.hasReply ? '<span class="text-[6px] font-black uppercase bg-fuchsia-500/10 text-fuchsia-400 px-2 py-1 rounded">reply</span>' : ''}
                ${c.flags.hasEvent ? '<span class="text-[6px] font-black uppercase bg-teal-500/10 text-teal-400 px-2 py-1 rounded">event</span>' : ''}
                ${c.permission ? '<span class="text-[6px] font-black uppercase bg-red-500/10 text-red-400 px-2 py-1 rounded">perm ' + c.permission + '</span>' : ''}
                ${c.findings.length ? '<span class="text-[6px] font-black uppercase bg-white/5 text-gray-400 px-2 py-1 rounded">' + c.findings.length + ' issue' + (c.findings.length>1?'s':'') + '</span>' : ''}
            </div>
        </div>`).join('');
}

/* ---------- detail ---------- */
function openDetail(file) {
    const c = ALL.find(x => x.file === file);
    if (!c) return;
    const sev = { crit: ['text-red-400','bg-red-500/10'], warn: ['text-amber-400','bg-amber-500/10'] };
    const meta = [
        ['Name', c.name], ['File', c.file], ['Version', c.version], ['Category', c.category],
        ['Permission', c.permission === null ? null : c.permission], ['Prefix', c.usePrefix === null ? null : String(c.usePrefix)],
        ['Cooldown', c.cooldowns === null ? null : c.cooldowns + 's'], ['Usage', c.usages], ['Credits', c.credits],
        ['Dependencies', c.deps.length ? c.deps.join(', ') : null],
    ].filter(([, v]) => v !== null && v !== undefined && v !== '');

    Modal.show(`
        <div class="flex items-center gap-3 mb-1">
            <span class="w-2.5 h-2.5 rounded-full ${DOT[c.level]}"></span>
            <h2 class="text-2xl font-black text-white tracking-tighter italic uppercase">${esc(c.name || c.file)}</h2>
        </div>
        <p class="text-gray-500 text-[10px] mono mb-6">${esc(c.path)}</p>
        <p class="text-gray-400 text-xs leading-relaxed mb-6">${esc(c.description || 'No description provided.')}</p>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
            ${meta.map(([k, v]) => `<div class="bg-black/30 rounded-xl p-3">
                <p class="text-[7px] font-black text-gray-600 uppercase tracking-widest mb-1">${esc(k)}</p>
                <p class="text-[10px] text-gray-300 mono break-all">${esc(v)}</p></div>`).join('')}
        </div>

        ${c.findings.length ? `
        <h3 class="text-white font-black text-[10px] uppercase tracking-widest mb-3">Diagnostics</h3>
        <div class="space-y-2 mb-6">
            ${c.findings.map(f => `<div class="flex items-start gap-3 ${sev[f.sev][1]} rounded-xl p-3">
                <span class="${sev[f.sev][0]} text-[8px] font-black uppercase tracking-widest mt-0.5">${f.sev}</span>
                <span class="text-[10px] text-gray-300 leading-relaxed">${esc(f.msg)}</span></div>`).join('')}
        </div>` : `
        <div class="bg-emerald-500/10 rounded-xl p-4 mb-6 text-center">
            <p class="text-emerald-400 text-[10px] font-black uppercase tracking-widest">No issues detected</p>
        </div>`}

        <h3 class="text-white font-black text-[10px] uppercase tracking-widest mb-3">Run in a thread</h3>
        <div class="flex gap-2 mb-6">
            <select id="run-thread" class="flex-1 bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white mono text-[10px] outline-none focus:border-indigo-500">
                <option value="">Loading threads...</option>
            </select>
            <input id="run-args" type="text" placeholder="args" class="w-28 bg-black/40 border border-white/10 rounded-xl px-3 py-3 text-white mono text-[10px] outline-none focus:border-indigo-500">
            <button onclick="runCommand('${esc(c.name || '')}')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-black text-[9px] uppercase tracking-widest transition-all active:scale-95">Send</button>
        </div>
        <p id="run-result" class="text-[9px] mono text-gray-600 mb-6"></p>

        <details class="group">
            <summary class="cursor-pointer text-white font-black text-[10px] uppercase tracking-widest mb-3 select-none">Source (${c.src.split(String.fromCharCode(10)).length} lines)</summary>
            <div class="bg-black/40 rounded-xl overflow-auto max-h-80 mt-2">
                <pre class="language-javascript"><code>${esc(c.src.slice(0, 20000))}</code></pre>
            </div>
        </details>
    `);
    Prism.highlightAll();
    loadThreads();
}

/* ---------- thread picker + test runner ---------- */
async function loadThreads() {
    const sel = document.getElementById('run-thread');
    if (!sel) return;
    try {
        const r = await fetch('/api/thread/list');
        const d = await r.json();
        const ts = d.threads || [];
        sel.innerHTML = ts.length
            ? ts.map(t => `<option value="${esc(t.threadID)}">${esc(t.name || 'Unknown')} · ${esc(t.threadID)}</option>`).join('')
            : '<option value="">No threads found</option>';
    } catch (e) { sel.innerHTML = '<option value="">Could not load threads</option>'; }
}

async function runCommand(name) {
    const sel = document.getElementById('run-thread');
    const out = document.getElementById('run-result');
    const args = (document.getElementById('run-args').value || '').trim();
    const id = sel.value;
    if (!id) { out.innerHTML = '<span class="text-red-400">Pick a thread first.</span>'; return; }
    const msg = '/' + name + (args ? ' ' + args : '');
    out.innerHTML = 'Dispatching <span class="text-indigo-400">' + esc(msg) + '</span>...';
    try {
        const r = await fetch(`/api/thread/send?id=${encodeURIComponent(id)}&message=${encodeURIComponent(msg)}`);
        out.innerHTML = r.ok
            ? '<span class="text-emerald-400">Sent ' + esc(msg) + ' — check the thread.</span>'
            : '<span class="text-red-400">Send failed (HTTP ' + r.status + ')</span>';
    } catch (e) { out.innerHTML = '<span class="text-red-400">' + esc(e.message) + '</span>'; }
}

/* ---------- search ---------- */
document.getElementById('search').addEventListener('input', e => { QUERY = e.target.value; render(); });

/* ---------- particles (matches the other pages) ---------- */
(function particles() {
    const canvas = document.getElementById('particle-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w, h, ps = [];
    const resize = () => { w = canvas.width = innerWidth; h = canvas.height = innerHeight; };
    resize(); addEventListener('resize', resize);
    for (let i = 0; i < 40; i++) ps.push({ x: Math.random()*w, y: Math.random()*h, vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3, r: Math.random()*1.6+.4 });
    (function loop() {
        ctx.clearRect(0,0,w,h);
        ps.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > w) p.vx *= -1;
            if (p.y < 0 || p.y > h) p.vy *= -1;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(99,102,241,0.35)'; ctx.fill();
        });
        requestAnimationFrame(loop);
    })();
})();

/* ---------- boot: same auth gate as the dashboard ---------- */
(async function boot() {
    // identical logic to the dashboard's authGuard — only redirect on a real
    // auth failure, not on any non-200 (that was sending valid sessions to /login)
    try {
        const response = await fetch('/api/auth/verify', { method: 'GET', credentials: 'include' });
        if (!response.ok) {
            if (response.status === 401 || response.status === 403) { window.location.href = '/login'; return; }
            const text = await response.text();
            if (text.includes('unauthorized') || text.includes('unauthenticated')) { window.location.href = '/login'; return; }
        } else {
            const data = await response.json().catch(() => ({}));
            if (data.authenticated === false || data.loggedIn === false) { window.location.href = '/login'; return; }
        }
    } catch (err) { window.location.href = '/login'; return; }
    scanCommands();
})();
</script>
