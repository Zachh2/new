<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FILE MANAGEMENT ZACH BOT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');
        .pop-in { animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #edit, #highlight-layer, #highlight-code { font-family: 'Fira Code', monospace !important; font-size: 14px !important; line-height: 1.6 !important; tab-size: 4; }
        .editor-container { position: relative; height: 100%; width: 100%; }
        #edit { color: transparent; caret-color: white; z-index: 10; background: transparent; }
        #highlight-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden !important; background: transparent !important; }
        pre[class*="language-"] { background: transparent !important; margin: 0 !important; padding: 1rem !important; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f46e5; }
    </style>
    <link rel="stylesheet" href="/theme.css">
    <script defer src="/palette.js"></script>
    <script defer src="/telemetry.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZACH_CORE">
    <link rel="apple-touch-icon" href="/icon.svg">
    <script defer src="/mobile.js"></script>
</head>
<body class="bg-[#0d1117] text-gray-300 h-screen flex flex-col overflow-hidden">

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-6 transition-all">
        <div id="modal-box" class="bg-[#1c2128] border border-[#30363d] w-full max-w-xs rounded-3xl p-6 shadow-2xl pop-in text-center">
            <div id="modal-icon" class="w-12 h-12 bg-indigo-500/10 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4">✓</div>
            <p id="modal-msg" class="text-white text-sm font-medium mb-6"></p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-2xl font-bold text-white active:scale-95 transition-all shadow-lg shadow-indigo-500/20">OKAY</button>
        </div>
    </div>

    <header class="h-16 bg-[#0d1117] border-b border-[#30363d] flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-4">
            <button onclick="goBack()" class="p-2 hover:bg-[#21262d] rounded-xl text-gray-400 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="flex flex-col">
                <h1 class="text-[10px] font-black text-indigo-500 tracking-[0.2em] uppercase">File System</h1>
                <div id="path-view" class="text-[11px] font-mono text-gray-500 truncate max-w-[200px]">/root</div>
            </div>
        </div>
        <div class="flex items-center gap-2">
             <button id="del-btn" onclick="del()" class="hidden hover:bg-red-500/10 text-red-500 p-2 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
             </button>
             <button id="save-btn" onclick="save()" class="hidden bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-xl text-xs font-bold text-white transition-all active:scale-95 shadow-lg shadow-indigo-500/20">SAVE</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <aside id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-[#161b22] border-r border-[#30363d] flex flex-col z-30 transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0 md:relative">
            <div class="p-4 flex items-center justify-between border-b border-[#30363d]/50">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Explorer</span>
                <div class="flex gap-1">
                    <button onclick="promptNewFile()" class="p-2 hover:bg-indigo-500/10 rounded-lg text-indigo-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                    </button>
                    <button onclick="refresh()" class="p-2 hover:bg-[#21262d] rounded-lg text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                    </button>
                </div>
            </div>
            <div id="list" class="flex-1 overflow-y-auto px-3 py-4 space-y-1"></div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden bg-[#0d1117]">
            <div class="flex items-center px-6 py-2 bg-[#161b22]/50 border-b border-[#30363d]">
                <input id="cur-file" readonly class="flex-1 bg-transparent text-[11px] text-indigo-300 font-mono outline-none truncate" placeholder="No file selected">
            </div>

            <div class="flex-1 overflow-hidden relative">
                <div id="text-view" class="hidden h-full w-full editor-container">
                    <textarea id="edit" oninput="updateSync()" onscroll="syncScroll(this)" spellcheck="false" 
                        class="absolute inset-0 w-full h-full p-4 outline-none z-10 resize-none whitespace-pre overflow-auto"></textarea>
                    <pre id="highlight-layer" class="m-0"><code id="highlight-code" class="language-javascript"></code></pre>
                </div>

                <div id="media-view" class="hidden h-full flex items-center justify-center p-8 slide-up">
                    <div class="relative group max-w-full max-h-full">
                        <img id="img-pre" class="hidden max-w-full max-h-full object-contain rounded-2xl shadow-2xl border border-[#30363d]">
                        <video id="vid-pre" controls class="hidden max-w-full max-h-full rounded-2xl border border-[#30363d]"></video>
                        <audio id="aud-pre" controls class="hidden min-w-[300px]"></audio>
                    </div>
                </div>

                <div id="empty-view" class="h-full flex flex-col items-center justify-center text-gray-600 gap-4">
                    <div class="w-16 h-16 border-2 border-dashed border-gray-800 rounded-3xl flex items-center justify-center text-2xl group-hover:border-indigo-500 transition-colors pointer-events-none">+</div>
                    <span class="text-[10px] font-mono uppercase tracking-[0.3em]">Select_File_to_View</span>
                </div>
            </div>

            <button onclick="toggleSide()" class="md:hidden fixed bottom-8 right-8 w-14 h-14 bg-indigo-600 rounded-2xl shadow-2xl shadow-indigo-500/40 z-40 flex items-center justify-center text-white active:scale-90 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>
        </main>
    </div>

    <script>
        let path = "";
        const side = document.getElementById('sidebar');

        function toggleSide() { side.classList.toggle('-translate-x-full'); }

        function showModal(m, isError = false) { 
            const icon = document.getElementById('modal-icon');
            icon.innerText = isError ? '!' : '✓';
            icon.className = isError ? 'w-12 h-12 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4' : 'w-12 h-12 bg-indigo-500/10 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4';
            document.getElementById('modal-msg').innerText = m; 
            document.getElementById('modal-overlay').classList.replace('hidden', 'flex'); 
        }

        function closeModal() { document.getElementById('modal-overlay').classList.replace('flex', 'hidden'); }

        function syncScroll(el) {
            const layer = document.getElementById('highlight-layer');
            layer.scrollTop = el.scrollTop;
            layer.scrollLeft = el.scrollLeft;
        }

        function updateSync() {
            const editor = document.getElementById('edit');
            const codeTag = document.getElementById('highlight-code');
            codeTag.textContent = editor.value;
            Prism.highlightElement(codeTag);
            syncScroll(editor);
        }

        async function refresh() {
            try {
                const res = await fetch('/api/files/list?path=' + path);
                const files = await res.json();
                files.sort((a,b) => b.isDirectory - a.isDirectory || a.name.localeCompare(b.name));
                document.getElementById('path-view').innerText = '/' + path;
                const list = document.getElementById('list');
                list.innerHTML = files.map((f, index) => `
                    <div class="slide-up flex items-center p-3 rounded-xl hover:bg-[#21262d] cursor-pointer transition-all active:scale-[0.97] group" style="animation-delay: ${index * 0.03}s">
                        <div onclick="clickItem('${f.name}', ${f.isDirectory})" class="flex items-center flex-1 truncate">
                            <span class="mr-3 text-lg opacity-70 group-hover:opacity-100 transition-opacity">${f.isDirectory ? '📁' : '📄'}</span>
                            <span class="text-sm truncate font-medium ${f.isDirectory ? 'text-gray-200' : 'text-gray-400 group-hover:text-gray-200'}">${f.name}</span>
                        </div>
                        <button onclick="renameItem('${f.name}')" class="opacity-0 group-hover:opacity-100 p-1.5 hover:bg-indigo-500/20 text-indigo-400 rounded-lg transition-all" title="Rename">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                        </button>
                    </div>
                `).join('');
            } catch(e) { console.error("Refresh failed", e); }
        }

        async function promptNewFile() {
            const name = prompt("Enter new filename:");
            if (!name) return;
            const fullPath = path ? `${path}/${name}` : name;
            try {
                const res = await fetch('/api/files/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: fullPath })
                });
                if((await res.json()).success) { refresh(); load(fullPath); }
            } catch(e) { showModal("Network Error", true); }
        }

        // RENAME LOGIC (Handles Files and Folders)
        async function renameItem(oldName) {
            const newName = prompt(`Rename "${oldName}" to:`, oldName);
            if (!newName || newName === oldName) return;

            const oldFullPath = path ? `${path}/${oldName}` : oldName;
            
            try {
                const res = await fetch('/api/files/rename', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ oldPath: oldFullPath, newName: newName })
                });
                const data = await res.json();
                if(data.success) {
                    showModal("Renamed successfully");
                    refresh();
                    // If the currently open file was renamed, update the view
                    if(document.getElementById('cur-file').value === oldFullPath) {
                        const newPath = path ? `${path}/${newName}` : newName;
                        load(newPath);
                    }
                } else {
                    showModal(data.msg || "Rename failed", true);
                }
            } catch(e) { showModal("Network Error", true); }
        }

        function clickItem(n, isDir) {
            const p = path ? `${path}/${n}` : n;
            if(isDir) { path = p; refresh(); } 
            else { load(p); if(window.innerWidth < 768) toggleSide(); }
        }

        function goBack() { 
            if(!path) return;
            const parts = path.split('/'); parts.pop(); 
            path = parts.join('/'); refresh(); 
        }

        async function load(p) {
            const ext = p.split('.').pop().toLowerCase();
            const views = ['text-view', 'media-view', 'empty-view', 'img-pre', 'vid-pre', 'aud-pre'];
            views.forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('save-btn').classList.add('hidden');
            document.getElementById('del-btn').classList.remove('hidden');
            document.getElementById('cur-file').value = p;

            if(['png','jpg','jpeg','gif','webp'].includes(ext)) {
                document.getElementById('media-view').classList.remove('hidden');
                document.getElementById('img-pre').src = `/${p}`; 
                document.getElementById('img-pre').classList.remove('hidden');
            } else if(['mp4','webm'].includes(ext)) {
                document.getElementById('media-view').classList.remove('hidden');
                document.getElementById('vid-pre').src = `/${p}`; 
                document.getElementById('vid-pre').classList.remove('hidden');
            } else if(['mp3','wav'].includes(ext)) {
                document.getElementById('media-view').classList.remove('hidden');
                document.getElementById('aud-pre').src = `/${p}`; 
                document.getElementById('aud-pre').classList.remove('hidden');
            } else {
                document.getElementById('text-view').classList.remove('hidden');
                document.getElementById('save-btn').classList.remove('hidden');
                try {
                    const res = await fetch('/api/files/read?path=' + p);
                    const d = await res.json();
                    const editor = document.getElementById('edit');
                    editor.value = d.content; editor.scrollTop = 0; editor.scrollLeft = 0;
                    updateSync();
                } catch(e) { showModal("Error loading file."); }
            }
        }

        async function save() {
            const btn = document.getElementById('save-btn');
            const original = btn.innerText;
            btn.innerText = "SAVING...";
            try {
                const res = await fetch('/api/files/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: document.getElementById('cur-file').value, data: document.getElementById('edit').value })
                });
                if(res.ok) showModal("Sync Complete: File Saved.");
            } catch(e) { showModal("Save failed.", true); }
            btn.innerText = original;
        }

        async function del() {
            if(!confirm('Permanently delete?')) return;
            try {
                await fetch('/api/files/delete?path=' + document.getElementById('cur-file').value, { method: 'DELETE' });
                refresh();
                document.getElementById('empty-view').classList.remove('hidden');
                document.getElementById('text-view').classList.add('hidden');
                document.getElementById('media-view').classList.add('hidden');
                document.getElementById('cur-file').value = "";
                document.getElementById('del-btn').classList.add('hidden');
                document.getElementById('save-btn').classList.add('hidden');
            } catch(e) { showModal("Delete failed.", true); }
        }

        refresh();
    </script>
</body>
</html>
